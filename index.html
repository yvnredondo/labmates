<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://gtpwvbxtvmisbqyrppki.supabase.co wss://gtpwvbxtvmisbqyrppki.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>LabMates</title>
<meta name="description" content="Shared duty roster for lab med techs">
<meta name="theme-color" content="#0e6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#10201c; --muted:#566a64; --line:#d5dfdb; --soft:#e7eeeb;
  --accent:#0e6b5c; --accent-ink:#ffffff; --live:#8a4300; --live-bg:#fdeccb; --danger:#a12727;
  --shadow:0 1px 2px rgba(16,32,28,.06);
  --day-bg:#fbedcf; --day-ink:#734400; --mid-bg:#d7eeea; --mid-ink:#0a5246; --night-bg:#e2e1f6; --night-ink:#2f2a78; --other-bg:#e4e9ee; --other-ink:#33424f;
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1614; --surface:#14231f; --ink:#e7f0ed; --muted:#93a9a2; --line:#264039; --soft:#1c3029;
    --accent:#4fc3ad; --accent-ink:#06211b; --live:#fcd28a; --live-bg:#3a2a0d; --danger:#f19a9a;
    --shadow:none;
    --day-bg:#3a2b0e; --day-ink:#f5cd83; --mid-bg:#11352f; --mid-ink:#8edfcf; --night-bg:#22213f; --night-ink:#c4c1ff; --other-bg:#1f2a33; --other-ink:#c3d0db;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1614; --surface:#14231f; --ink:#e7f0ed; --muted:#93a9a2; --line:#264039; --soft:#1c3029;
  --accent:#4fc3ad; --accent-ink:#06211b; --live:#fcd28a; --live-bg:#3a2a0d; --danger:#f19a9a;
  --shadow:none;
  --day-bg:#3a2b0e; --day-ink:#f5cd83; --mid-bg:#11352f; --mid-ink:#8edfcf; --night-bg:#22213f; --night-ink:#c4c1ff; --other-bg:#1f2a33; --other-ink:#c3d0db;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;font-family:inherit;font-size:17px;background:var(--bg);color:var(--ink);line-height:1.4;padding-bottom:150px;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
main{max-width:560px;margin:0 auto;padding:18px 16px 0;}

.head{margin:4px 0 18px;}
.head h1{margin:0;font-size:2.1rem;line-height:1.1;font-weight:700;letter-spacing:-.01em;}
.head p{margin:4px 0 0;color:var(--muted);font-size:1rem;}

/* Duty card */
.duty{display:block;width:100%;text-align:left;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin:0 0 12px;box-shadow:var(--shadow);}
.duty .sign{background:var(--c);color:var(--t);padding:14px 16px;font-size:1.9rem;font-weight:700;line-height:1.1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;}
.duty .sign .full{font-size:.95rem;font-weight:400;opacity:.92;}
.duty .body{padding:14px 16px 14px;}
.duty .time{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;}
.scode{display:inline-block;font-size:1rem;line-height:1.2;padding:4px 9px;border-radius:8px;background:var(--ink);color:var(--bg);letter-spacing:0;font-weight:700;}
.scode.sm{font-size:.78rem;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:1px;}
.duty .meta{margin-top:6px;color:var(--muted);font-size:.95rem;}
.duty .note{margin-top:8px;font-size:1rem;}
.status{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;font-size:.92rem;font-weight:700;background:var(--soft);color:var(--muted);}
.status.live{background:var(--live-bg);color:var(--live);}
.status.soon{background:var(--soft);color:var(--ink);}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px;}
.empty h2{margin:0 0 4px;font-size:1.35rem;}
.empty p{margin:0;color:var(--muted);}
.empty .next{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink);}
.empty .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}

h2.sec{font-size:1.15rem;margin:26px 0 10px;}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.row.today{border:2px solid var(--accent);}
.row.off{background:transparent;border-style:dashed;padding:6px 12px;}
.row.off .dn b{font-size:1.15rem;}
.row.off .rs{font-size:.95rem;}
.row .dn{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.82rem;color:var(--muted);}
.row .dn b{font-size:1.4rem;color:var(--ink);}
.row .rt{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;}
.row .rs{font-size:.85rem;color:var(--muted);}
.chip{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;border-radius:8px;background:var(--c);color:var(--t);font-weight:700;font-size:.92rem;}
.chip.rd{background:var(--soft);color:var(--muted);}

/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.calhead h1{margin:0;font-size:1.5rem;text-align:center;}
.calhead .sub{display:block;font-size:.9rem;font-weight:400;color:var(--muted);}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.dow{font-size:.8rem;color:var(--muted);text-align:center;padding:2px 0 4px;}
.cell{min-height:66px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;overflow:hidden;}
.cell.blank{border:0;background:transparent;pointer-events:none;}
.cell .n{font-size:.9rem;font-weight:700;padding-left:2px;}
.cell.today .n{color:var(--accent);}
.cell.today{border-color:var(--accent);}
.cell.sel{background:var(--soft);border-color:var(--ink);}
.pill{display:block;font-size:.68rem;line-height:1.25;padding:1px 4px;border-radius:5px;background:var(--c);color:var(--t);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:clip;}
.more{font-size:.68rem;color:var(--muted);padding-left:3px;}
.daypanel{margin-top:18px;}
.pay{display:inline-block;margin:-6px 0 14px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:.92rem;font-weight:700;}
.pay.now{background:var(--accent);color:var(--accent-ink);}
.paytag{display:inline-block;margin-top:2px;font-size:.62rem;font-weight:700;line-height:1.3;padding:0 4px;border-radius:4px;background:var(--ink);color:var(--bg);}
.cell .top{display:flex;align-items:center;justify-content:space-between;}
.sync{margin:-8px 0 14px;padding:8px 12px;border-radius:10px;background:var(--live-bg);color:var(--live);font-size:.92rem;font-weight:700;}
.daypanel h2{margin:0 0 10px;font-size:1.2rem;}

.cocard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px;}
.paybar{--pb-bg:var(--accent);display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);}
.pb-ico{flex:none;display:grid;place-items:center;}
.pb-ico .ico{width:28px;height:28px;}
.pb-text{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;}
.pb-text small{font-size:.8rem;opacity:.9;}
.pb-text b{font-size:1.1rem;}
.pb-n{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;}
.pb-n b{font-size:1.9rem;font-variant-numeric:tabular-nums;}
.pb-n small{font-size:.75rem;opacity:.9;}
.cohead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 4px;}
.iconbtn.sm{width:36px;height:36px;border-radius:10px;}
.iconbtn.sm svg{width:16px;height:16px;}
.cotitle{text-align:center;display:flex;flex-direction:column;line-height:1.2;}
.cotitle small{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.cotitle b{font-size:1.1rem;}
.cotitle .paidon{font-size:.8rem;color:var(--muted);margin-top:2px;}
.costats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;padding:10px 12px 4px;}
.cs{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.cs b{font-size:2.2rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.cs span{font-size:.9rem;font-weight:700;}
.cs small{font-size:.78rem;margin-top:3px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-duty{background:var(--accent);color:var(--accent-ink);}
.cs-rest{background:var(--soft);color:var(--ink);}
.cs-leave{background:var(--soft);color:var(--ink);}
.codots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:10px 12px 4px;}
.dot-d{border:0;border-radius:8px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0;}
.dot-d span{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;}
.dot-d small{font-size:.6rem;font-weight:700;opacity:.9;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap;}
.dot-d.k-duty{background:var(--accent);color:var(--accent-ink);}
.dot-d.k-rest{background:var(--soft);color:var(--muted);}
.dot-d.k-leave{background:var(--lc);color:var(--lt);}
.dot-d.is-past{opacity:.5;}
.dot-d.is-today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);opacity:1;}
.conote{margin:6px 14px 14px;font-size:.85rem;color:var(--muted);}
.avimg{display:block;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);object-fit:cover;}
img.av{width:34px;height:34px;flex:none;}
.avprev{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.avbig{width:96px;height:96px;flex:none;}
.avgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px;}
.avopt{border:3px solid transparent;border-radius:50%;padding:0;background:none;aspect-ratio:1;}
.avopt img{width:100%;height:100%;}
.avopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset;}
.head.withav{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.meav{border:0;padding:0;background:none;border-radius:50%;flex:none;position:relative;}
.meav img,.meav .meav-empty{width:56px;height:56px;border-radius:50%;display:block;}
.meav .meav-empty{display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:.7rem;font-weight:700;text-align:center;line-height:1.1;border:2px dashed var(--line);}
.cmpbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;}
.cmpbtn .ico{width:20px;height:20px;}
.avbtn{border:0;padding:0;background:none;border-radius:50%;}
.ctray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--soft);margin:0 0 10px;min-height:52px;}
.ctray-l{width:100%;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.ctray-e{font-size:.9rem;color:var(--muted);}
.cpick{display:flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-size:.9rem;}
.cpick img.av{width:28px;height:28px;}
.cpick i{font-style:normal;font-size:1.15rem;line-height:1;opacity:.85;margin-left:2px;}
.csearch{position:relative;margin:0 0 10px;}
.csearch .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;}
.csearch input{width:100%;padding:11px 12px 11px 38px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:46px;}
#cmp-none{margin:0 0 8px;}
.cpeople{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;}
.cpeople::-webkit-scrollbar{display:none;}
.cperson{flex:none;}
.cperson[hidden]{display:none;}
.cperson{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-size:.9rem;}
.cperson img.av{width:28px;height:28px;}
.cperson[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 12px;}
.cfilter{margin-bottom:10px;}
.cfilter button{font-size:.85rem;padding:9px 4px;}
.cday{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--surface);}
.cday.is-tog{border-color:var(--accent);border-width:2px;}
.cdate{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.8rem;color:var(--muted);}
.cdate b{font-size:1.4rem;color:var(--ink);}
.cdate small{font-size:.7rem;}
.cbody{display:flex;flex-direction:column;gap:6px;min-width:0;}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.crow img.av{width:26px;height:26px;}
.cname{font-weight:700;font-size:.92rem;min-width:52px;}
.cchip{display:inline-block;padding:2px 8px;border-radius:7px;font-size:.8rem;font-weight:700;background:var(--c);color:var(--t);}
.cchip.rd{background:var(--soft);color:var(--muted);}
.cbadge{align-self:flex-start;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;}
.cbadge.tog{background:var(--accent);color:var(--accent-ink);}
.cbadge.same{background:var(--ink);color:var(--bg);}
.cbadge.off{background:var(--soft);color:var(--ink);}
.hs{position:relative;--hs-fade:var(--bg);}
.sheet .hs{--hs-fade:var(--surface);}
.hs::before,.hs::after{content:"";position:absolute;top:0;bottom:6px;width:36px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2;}
.hs::before{left:-16px;background:linear-gradient(to right,var(--hs-fade),transparent);}
.hs::after{right:-16px;background:linear-gradient(to left,var(--hs-fade),transparent);}
.hs:has(.boardwrap)::before{left:-4px;}.hs:has(.boardwrap)::after{right:-4px;}
.hs.can-l::before,.hs.can-r::after{opacity:1;}
.hs-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:none;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0;}
.hs-btn svg{width:18px;height:18px;}
.hs-l{left:-10px;}.hs-r{right:-10px;}
.hs.can-l .hs-l,.hs.can-r .hs-r{display:grid;}
.hs:has(.boardwrap) .hs-btn{top:28px;transform:none;}
@media (prefers-reduced-motion:no-preference){.hs.nudge .hs-r{animation:hsnudge 1s ease-in-out 2;}@keyframes hsnudge{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(5px)}}
.hs.nudge:has(.boardwrap) .hs-r{animation-name:hsnudge2;}@keyframes hsnudge2{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;}
.sechead h2.sec{margin:0;}
.secn{font-size:.85rem;color:var(--muted);}
.seeall{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;color:var(--accent);}
.seeall svg{width:16px;height:16px;}
.qstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0;}
.qs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.qs small{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.qs b{font-size:1.25rem;margin-top:3px;}
.qs-sub{font-size:.82rem;color:var(--muted);margin-top:2px;}
.qs-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--ink);margin-bottom:8px;--tone-bg:var(--soft);}
.qs-ico .ico{width:18px;height:18px;}
.qs.warn{border-color:var(--live);background:var(--live-bg);}
.qs.warn .qs-ico{background:var(--live);color:var(--live-bg);--tone-bg:var(--live);}
.qs.warn .qs-sub,.qs.warn small{color:var(--live);}
.withyou{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px;}
.wy-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.wy-head b{font-size:1.05rem;}
.wy-head span{font-size:.85rem;color:var(--muted);}
.wy-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.wy{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 8px 3px 3px;}
.wy img.av{width:28px;height:28px;}
.wy-n{font-weight:700;font-size:.9rem;}
.wy-note{margin:8px 0 0;font-size:.82rem;color:var(--muted);}
.holtag{display:inline-block;margin-top:2px;font-size:.6rem;font-weight:700;line-height:1.3;padding:0 4px;border-radius:4px;background:var(--live-bg);color:var(--live);}
.brandbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px;}
.brandbar .bmark{flex:none;}
.bb-text{display:flex;flex-direction:column;line-height:1.1;}
.bb-text b{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;}
.bb-text b span{color:var(--accent);}
.bb-text small{font-size:.75rem;color:var(--muted);}
.morebrand{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
/* Team */
.todaylink{display:block;margin:0 auto 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;}
.ico{flex:none;display:block;}
.schip .ico{width:22px;height:22px;}
.schip .ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.shead .ico{width:22px;height:22px;}
.shiftopt .ico{margin:0 auto 2px;width:18px;height:18px;}
.shiftopt[aria-pressed="true"]{--tone-bg:var(--accent);}
.shiftopt{--tone-bg:var(--bg);}
.schip{cursor:pointer;}
.schip[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--tone-ink);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.boardwrap{overflow-x:auto;margin:0 -4px;}
table.board{border-collapse:separate;border-spacing:4px;width:100%;font-size:.9rem;}
table.board th,table.board td{text-align:left;vertical-align:top;}
table.board thead th.bh{background:var(--tone-bg);color:var(--tone-ink);border-radius:12px;padding:6px 8px;min-width:72px;}
table.board thead th.bh .ico{width:16px;height:16px;margin-bottom:2px;}
table.board thead th.bh b{display:block;font-size:1rem;}
table.board thead th.bh small{font-size:.72rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
table.board tbody th,table.board th.corner{position:sticky;left:0;z-index:1;background:var(--bg);padding:4px 4px 4px 0;width:1%;white-space:nowrap;}
table.board td{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;line-height:1.35;}
table.board td.gap{color:var(--muted);background:transparent;border-style:dashed;text-align:center;}
.bn{display:block;}
.bn.me{color:var(--accent);font-weight:700;}
.bn small{color:var(--muted);}
.dot{color:var(--accent);font-weight:700;margin-left:1px;}
.offline{margin:12px 0 0;font-size:.9rem;color:var(--muted);line-height:1.6;}
.offline b{color:var(--ink);}
.bnotes .pnote{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;}
.bnotes .where{color:var(--muted);font-size:.85rem;}
.wholeday{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 14px;margin:0 0 16px;box-shadow:var(--shadow);}
.wd-ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);}
.wd-ico .ico{width:26px;height:26px;}
.wd-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.wd-text b{font-size:1.15rem;line-height:1.2;}
.wd-text small{font-size:.86rem;color:var(--muted);line-height:1.3;}
.wd-n{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;}
.wd-n b{font-size:1.6rem;font-variant-numeric:tabular-nums;}
.wd-n small{font-size:.75rem;color:var(--muted);}
.wholeday[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}
.wholeday[aria-pressed="true"] .wd-ico{background:var(--accent-ink);color:var(--accent);}
.wholeday[aria-pressed="true"] small{color:var(--accent-ink);opacity:.9;}
.striplabel{margin:4px 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.daystrip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;}
.daystrip::-webkit-scrollbar{display:none;}
.daystrip .schip{flex:0 0 172px;scroll-snap-align:start;}
.schip{border:0;border-radius:14px;background:var(--tone-bg);color:var(--tone-ink);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;}
.schip b{font-size:1.3rem;line-height:1.1;}
.schip .ct{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.schip .cn{font-size:.78rem;opacity:.85;}
.sblock{margin-top:16px;border-radius:18px;background:var(--tone-bg);padding:4px 6px 6px;scroll-margin-top:12px;}
.shead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:8px 8px 10px;color:var(--tone-ink);}
.sbadge{font-size:1.1rem;font-weight:700;line-height:1.2;padding:3px 10px;border-radius:999px;background:var(--tone-ink);color:var(--tone-bg);}
.stime{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;}
.scount{margin-left:auto;font-size:.82rem;white-space:nowrap;}
.sbody{display:grid;gap:6px;}
.sbody .postcard{margin-top:0;border-color:transparent;}
.tone-day{--tone-bg:var(--day-bg);--tone-ink:var(--day-ink);}
.tone-mid{--tone-bg:var(--mid-bg);--tone-ink:var(--mid-ink);}
.tone-night{--tone-bg:var(--night-bg);--tone-ink:var(--night-ink);}
.tone-other{--tone-bg:var(--other-bg);--tone-ink:var(--other-ink);}
.tone-off{--tone-bg:var(--soft);--tone-ink:var(--muted);}
.postcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin-top:8px;}
.postrow{display:flex;align-items:center;gap:10px;}
.posttag{flex:none;padding:5px 10px;border-radius:8px;font-size:.85rem;font-weight:700;background:var(--c);color:var(--t);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.avrow{display:flex;gap:6px;flex-wrap:wrap;}
.av{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:var(--soft);display:block;}
.av.me{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);}
.names{margin-top:8px;font-size:.9rem;color:var(--muted);line-height:1.5;}
.names b{color:var(--ink);}
.pnote{margin-top:4px;font-size:.9rem;}
.pnote b{font-weight:700;}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:46px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.danger{color:var(--danger);}
.btn.block{width:100%;}

/* Tab bar + add button */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;}
.tabs .inner{display:flex;width:100%;max-width:560px;gap:6px;}
.tab{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem;}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft);}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30;}
.scrim.open{display:flex;}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));}
.sheet h2{margin:0 0 14px;font-size:1.3rem;}
label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px;}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px;}
.search{background:var(--surface);margin-bottom:12px;}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.chipbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.92rem;}
.modeseg{margin:0 0 14px;--seg-bg:var(--bg);}
.modeseg button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;}
.modeseg button .ico{width:20px;height:20px;}
.modeseg button[aria-pressed="true"]{--seg-bg:var(--accent);}
.leavegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.leaveopt{--tone-bg:var(--c);border:3px solid transparent;border-radius:12px;padding:10px 8px;background:var(--c);color:var(--t);display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15;text-align:center;}
.leaveopt .ico{width:24px;height:24px;}
.leaveopt b{font-size:1.15rem;}
.leaveopt small{font-size:.75rem;}
.leaveopt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface);}
.leaveconf{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--live-bg);color:var(--live);}
.leaveconf p{margin:0 0 6px;font-weight:700;font-size:.92rem;}
.leaveconf .check{display:flex;align-items:center;gap:8px;margin:0;font-size:.92rem;}
.leaveconf input{width:20px;height:20px;accent-color:var(--accent);}
.shiftgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px;}
.shiftopt{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center;line-height:1.2;min-height:52px;}
.shiftopt b{display:block;font-size:1.05rem;}
.shiftopt small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.shiftopt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.shiftopt[aria-pressed="true"] small{color:var(--accent-ink);}
.btnrow{display:flex;gap:10px;margin-top:20px;}
.btnrow .btn{flex:1;}
.err{color:var(--danger);margin:10px 0 0;font-size:.95rem;min-height:1.2em;}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-weight:700;}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.menu{display:grid;gap:10px;margin-top:6px;}
.preview{margin-top:10px;font-size:.92rem;color:var(--muted);}
.statbig{text-align:center;margin:22px 0 2px;}
.statbig .num{font-size:3.2rem;font-weight:700;line-height:1;letter-spacing:-.02em;}
.statbig .lbl{color:var(--muted);font-size:.95rem;margin-top:4px;}
.toppost{margin:18px 0 6px;border-radius:14px;padding:16px;background:var(--c);color:var(--t);}
.toppost .tp-lbl{font-size:.8rem;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.toppost .tp-name{font-size:1.4rem;font-weight:700;margin-top:2px;}
.toppost .tp-n{font-size:.9rem;opacity:.9;margin-top:2px;}
.bars{display:grid;gap:8px;margin-top:8px;}
.barrow{display:grid;grid-template-columns:40px 1fr 28px;align-items:center;gap:8px;}
.barrow .bl{font-size:.82rem;font-weight:700;color:var(--muted);}
.btrack{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;}
.bfill{height:100%;border-radius:7px;}
.barrow .bn{font-size:.85rem;font-weight:700;text-align:right;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-weight:700;max-width:90%;text-align:center;display:none;}
.toast.show{display:block;}
.postgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.postopt{border:3px solid transparent;border-radius:12px;padding:12px 10px;font-weight:700;background:var(--c);color:var(--t);text-align:left;min-height:52px;line-height:1.2;}
.postopt b{font-size:1.15rem;}
.postopt small{font-size:.8rem;font-weight:400;}
.postopt .ck{display:none;}
.postopt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface);}
.postopt[aria-pressed="true"] .ck{display:inline;}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;}
.customrow{display:none;}
.hide{display:none;}
.customrow.show{display:block;}
select{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px;}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) 16px 40px;background:var(--bg);}
.gate[hidden]{display:none;}
.boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink,#444);font-weight:600;text-align:center;padding:24px;}
.bootlate{opacity:0;animation:bootin .4s 5s forwards;font-weight:500;}
.bootlate a{color:inherit;text-decoration:underline;}
@keyframes bootin{to{opacity:1;}}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.gcard{width:100%;max-width:420px;}
.gbrand{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 24px;text-align:center;}
.gbrand b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2.2rem;letter-spacing:-.02em;line-height:1;}
.gbrand b span{color:var(--accent);}
.gbrand small{color:var(--muted);font-size:.95rem;}
.gpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px;box-shadow:var(--shadow);}
.gpanel h1{margin:0 0 4px;font-size:1.45rem;}
.gpanel>p{margin:0 0 6px;color:var(--muted);}
.gpanel input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px;}
.gpanel .btn{width:100%;margin-top:18px;}
.gerr{color:var(--danger);font-weight:700;font-size:.92rem;margin:12px 0 0;min-height:1em;}
.gerr:empty{display:none;}
.gok{background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:.95rem;}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1f1f1f;border:1px solid #747775;font-family:Roboto,Arial,system-ui,sans-serif;font-weight:500;}
.gbtn .gicon{width:20px;height:20px;flex:none;}
.gbtn:disabled{opacity:.7;}
.gfine{text-align:center;margin-top:12px;}
.gor{display:flex;align-items:center;gap:10px;margin:18px 0 2px;color:var(--muted);font-size:.85rem;font-weight:700;}
.gor::before,.gor::after{content:"";flex:1;height:1px;background:var(--line);}
.gpanel .gbtn{margin-top:14px;}
.glinks{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;}
.glink{background:none;border:0;color:var(--accent);font-weight:700;padding:8px;text-decoration:underline;text-underline-offset:3px;}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.mrow:first-of-type{border-top:0;}
.mrow .mname{flex:1;min-width:0;}
.mrow .mname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow .mname small{color:var(--muted);font-size:.82rem;display:block;}
.mrow .mname small.memail{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow .btn{min-height:40px;padding:8px 12px;font-size:.9rem;}
.mrow{flex-wrap:wrap;}
.actbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--live-bg);color:var(--live);font-weight:700;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 8px rgba(0,0,0,.12);}
.actbar[hidden]{display:none;}
.actbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.actbar button{flex:none;border:0;border-radius:999px;background:var(--live);color:var(--live-bg);font-weight:700;padding:8px 16px;min-height:40px;}
body.acting main{padding-top:64px;}
.mrow .mname{flex-basis:160px;}
.mhid{display:inline-block;padding:0 6px;border-radius:6px;background:var(--live-bg);color:var(--live);font-weight:700;}
.mbadge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:.78rem;font-weight:700;text-align:center;}
.tab{position:relative;}
.tab .tdot{position:absolute;top:4px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}

/* ---------- welcome slides ---------- */
.wl{display:flex;flex-direction:column;}
.wl-top{display:flex;justify-content:flex-end;min-height:40px;}
.wl-skip{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 4px;}
.wl-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 -16px;}
.wl-track::-webkit-scrollbar{display:none;}
.wl-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:4px 16px 0;display:flex;flex-direction:column;align-items:center;text-align:center;}
.wl-art{width:100%;max-width:340px;min-height:210px;display:grid;place-items:center;margin:4px 0 18px;border-radius:24px;background:var(--soft);padding:22px 18px;}
.wl-slide h2{margin:0 0 8px;font-size:1.5rem;line-height:1.2;}
.wl-slide p{margin:0;color:var(--muted);font-size:1.02rem;max-width:340px;}
.wl-brand b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2.3rem;letter-spacing:-.02em;display:block;margin-top:8px;}
.wl-brand b span{color:var(--accent);}
.wl-dots{display:flex;justify-content:center;gap:4px;margin:22px 0 4px;}
.wl-dot{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;}
.wl-dot::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .25s ease,background-color .25s ease;}
.wl-dot[aria-current="true"]::after{width:22px;background:var(--accent);}
.wl-nav{display:flex;gap:10px;margin-top:12px;}
.wl-nav .btn{flex:1;margin:0;}
.wl-nav .btn[hidden]{display:none;}
.wl-card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--shadow);}
.wl-card .wsign{background:var(--mid-bg);color:var(--mid-ink);padding:10px 14px;font-weight:700;font-size:1.3rem;}
.wl-card .wsign small{font-size:.85rem;font-weight:400;margin-left:8px;}
.wl-card .wbody{padding:10px 14px;}
.wl-card .wtime{font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px;}
.wl-card .wmeta{color:var(--muted);font-size:.85rem;margin-top:2px;}
.wl-mini{display:flex;gap:6px;margin-top:10px;width:100%;}
.wl-mini span{flex:1;border-radius:8px;padding:5px 0;font-size:.72rem;font-weight:700;text-align:center;background:var(--accent);color:var(--accent-ink);}
.wl-mini span.r{background:var(--surface);color:var(--muted);border:1px solid var(--line);}
.wl-mini span.l{background:var(--day-bg);color:var(--day-ink);}
.wl-group{width:100%;background:var(--day-bg);border-radius:14px;padding:10px 12px;text-align:left;}
.wl-group .gh{font-weight:700;color:var(--day-ink);font-size:.95rem;margin-bottom:8px;}
.wl-post{background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:6px;display:flex;align-items:center;gap:8px;}
.wl-post .pc{font-size:.75rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);}
.wl-people{display:flex;}
.wl-av{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;display:grid;place-items:center;color:#fff;font-size:.62rem;font-weight:700;}
.wl-av:first-child{margin-left:0;}
.wl-pay{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);text-align:left;}
.wl-pay .pb{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-ink);padding:12px 14px;}
.wl-pay .pb small{display:block;font-size:.75rem;opacity:.9;}
.wl-pay .pb b{font-size:1.05rem;}
.wl-pay .pb .n{font-size:1.9rem;font-weight:700;line-height:1;text-align:right;}
.wl-pay .pb .n small{font-size:.7rem;font-weight:400;}
.wl-pay .st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;}
.wl-pay .st div{background:var(--soft);border-radius:10px;padding:8px;font-size:.75rem;font-weight:700;}
.wl-pay .st div b{display:block;font-size:1.4rem;}
.wl-pay .st div.d{background:var(--accent);color:var(--accent-ink);}
.wl-lock{width:92px;height:92px;border-radius:28px;background:var(--surface);display:grid;place-items:center;color:var(--accent);box-shadow:var(--shadow);border:1px solid var(--line);}
.wl-lock svg{width:46px;height:46px;}
.wl-steps{display:flex;flex-direction:column;gap:6px;margin-top:14px;width:100%;}
.wl-steps div{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:7px 10px;font-size:.85rem;font-weight:700;text-align:left;}
.wl-steps i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem;}

/* ---------- guided tour ---------- */
.tour{position:fixed;inset:0;z-index:60;}
.tour[hidden]{display:none;}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,18,16,.72);pointer-events:none;}
.tour-hole.none{box-shadow:0 0 0 9999px rgba(8,18,16,.72);width:0!important;height:0!important;}
.tour-ring{position:fixed;border-radius:16px;border:3px solid #fff;pointer-events:none;}
.tour-tip{position:fixed;left:16px;right:16px;max-width:400px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.tour-tip .tstep{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.tour-tip h3{margin:4px 0 6px;font-size:1.25rem;}
.tour-tip p{margin:0;color:var(--muted);}
.tour-tip .tnav{display:flex;align-items:center;gap:8px;margin-top:14px;}
.tour-tip .tnav .sp{flex:1;}
.tour-tip .btn{min-height:42px;padding:9px 16px;}
.tour-tip .tskip{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 4px;}
